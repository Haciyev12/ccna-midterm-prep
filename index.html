<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetPrep — CCNA ITN Midterm Workbook</title>
  <meta name="description" content="A premium interactive workbook for CCNA Introduction to Networks. Topic recaps, quizzes with explanations, and predicted exam questions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="reading-bar"><div id="reading-fill"></div></div>

<div class="shell">
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle menu">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect y="2.5" width="16" height="1.5" rx="0.75" fill="currentColor"/><rect y="7.25" width="16" height="1.5" rx="0.75" fill="currentColor"/><rect y="12" width="10" height="1.5" rx="0.75" fill="currentColor"/></svg>
  </button>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand" data-view="home">
      <div class="sb-brand-mark">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <circle cx="11" cy="11" r="2.5" fill="white"/>
          <circle cx="11" cy="11" r="9" stroke="white" stroke-opacity="0.12" stroke-width="1"/>
          <circle cx="3.5" cy="5" r="1.8" fill="white" fill-opacity="0.45"/>
          <circle cx="18.5" cy="5" r="1.8" fill="white" fill-opacity="0.45"/>
          <circle cx="3.5" cy="17" r="1.8" fill="white" fill-opacity="0.45"/>
          <circle cx="18.5" cy="17" r="1.8" fill="white" fill-opacity="0.45"/>
          <line x1="11" y1="11" x2="3.5" y2="5" stroke="white" stroke-opacity="0.25" stroke-width="0.8"/>
          <line x1="11" y1="11" x2="18.5" y2="5" stroke="white" stroke-opacity="0.25" stroke-width="0.8"/>
          <line x1="11" y1="11" x2="3.5" y2="17" stroke="white" stroke-opacity="0.25" stroke-width="0.8"/>
          <line x1="11" y1="11" x2="18.5" y2="17" stroke="white" stroke-opacity="0.25" stroke-width="0.8"/>
        </svg>
        <div class="sb-brand-text">
          <div class="sb-brand-name">NetPrep</div>
          <div class="sb-brand-tag">CCNA Introduction to Networks</div>
        </div>
      </div>
    </div>

    <nav class="sb-nav">
      <div class="sb-section-label">Modules</div>
      <div id="module-nav-list"></div>

      <div class="sb-section-label" style="margin-top:16px">Resources</div>
      <div class="sb-link" data-view="predicted" id="nav-predicted">
        <span class="sb-link-icon"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 3.5h9M2 6.5h6M2 9.5h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
        Predicted Exam
      </div>
      <div class="sb-link" data-view="notes" id="nav-notes">
        <span class="sb-link-icon"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1.5" y="1" width="10" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M4 5h5M4 7.5h3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span>
        Study Notes
      </div>
      <div class="sb-link" data-view="flashcards" id="nav-flashcards">
        <span class="sb-link-icon"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1" y="2.5" width="8" height="6.5" rx="1.5" stroke="currentColor" stroke-width="1.3"/><rect x="4" y="4.5" width="8" height="6.5" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="var(--sb-bg)"/></svg></span>
        Flashcards
      </div>
      <div class="sb-link" data-view="home" id="nav-home">
        <span class="sb-link-icon"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1 6.5L6.5 1.5 12 6.5M2.5 5.5v5.5h3v-3h2v3h3V5.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Home
      </div>
    </nav>

    <div class="sb-footer">
      <div class="sb-footer-label">Overall Progress</div>
      <div class="sb-footer-track">
        <div class="sb-footer-fill" id="footer-bar-fill" style="width:0%"></div>
      </div>
      <div class="sb-footer-stat" id="footer-stat">0 / 105 answered</div>
    </div>
  </aside>

  <!-- CONTENT -->
  <main class="content" id="content">
    <div class="content-inner" id="content-inner"></div>
  </main>

</div>

<script src="data/questions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
