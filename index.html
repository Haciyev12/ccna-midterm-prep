<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetPrep – CCNA ITN Midterm Workbook</title>
  <meta name="description" content="Interactive CCNA ITN midterm exam workbook. Topic recaps, practice quizzes with hints and explanations, predicted exam questions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="shell">

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Mobile toggle -->
  <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle menu">☰</button>

  <!-- ─── Sidebar ─────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-name">NetPrep</div>
      <div class="brand-sub">CCNA ITN · Intro to Networks · Midterm</div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-label">Modules</div>
      <div id="module-nav-list"></div>

      <div class="nav-divider"></div>
      <div class="nav-label">Resources</div>

      <div class="sidebar-link" data-view="predicted" id="nav-predicted">
        📋 Predicted Exam Questions
      </div>
      <div class="sidebar-link" data-view="notes" id="nav-notes">
        📝 Study Notes
      </div>
      <div class="sidebar-link" data-view="flashcards" id="nav-flashcards">
        🃏 Flashcards
      </div>
      <div class="sidebar-link" data-view="home" id="nav-home">
        🏠 Home
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="footer-stat" id="footer-stat">0 / 105 questions answered</div>
      <div class="footer-bar">
        <div class="footer-bar-fill" id="footer-bar-fill" style="width:0%"></div>
      </div>
    </div>
  </aside>

  <!-- ─── Content ──────────────────────────────────── -->
  <main class="content" id="content">
    <div class="content-inner" id="content-inner">
      <!-- rendered by app.js -->
    </div>
  </main>

</div>

<script src="data/questions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
